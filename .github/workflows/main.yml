name: Build VitalOS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /opt
          export PATH=$PATH:/opt/gradle-8.2/bin
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VitalOS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
